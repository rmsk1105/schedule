<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>센터 일정판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg:#f2f4f8; --card:#ffffff; --ink:#141925; --muted:#677185; --line:#e6e9f0; --soft:#f6f7fb;
    --brand:#0e7c66; --brand-soft:#e3f4ef;
    --trip:#0e7c66; --trip-ink:#ffffff;
    --leave:#fcefd2; --leave-ink:#7d5200; --leave-line:#f0d9a0;
    --event:#ecebfe; --event-ink:#3a34c4; --event-line:#5b54f0;
    --warn-bg:#fdecea; --warn:#b3261e; --sun:#d64545; --sat:#3c6be0;
    --scrim:rgba(14,18,28,.45); --shadow:0 1px 2px rgba(20,25,37,.05), 0 8px 24px rgba(20,25,37,.06);
    --c-trip:#1fa37f; --c-leave:#f0a020; --c-event:#5b54f0;
    --t-trip:rgba(31,163,127,.13); --t-leave:rgba(240,160,32,.16); --t-event:rgba(91,84,240,.11);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0f131b; --card:#181e29; --ink:#eef1f7; --muted:#97a1b5; --line:#2a3242; --soft:#1e2532;
    --brand:#3fc4a5; --brand-soft:#173a32;
    --trip:#2aa386; --trip-ink:#03211a;
    --leave:#3b3220; --leave-ink:#f1d089; --leave-line:#5a4a25;
    --event:#262a4c; --event-ink:#bdb9ff; --event-line:#8580f7;
    --warn-bg:#3a1f1d; --warn:#ff8a80; --sun:#ff8a80; --sat:#8fb0ff;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --c-trip:#3fc4a5; --c-leave:#f5b84a; --c-event:#8580f7;
    --t-trip:rgba(63,196,165,.2); --t-leave:rgba(245,184,74,.2); --t-event:rgba(133,128,247,.22);
  } }
  * { box-sizing:border-box; }
  html, body { overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; letter-spacing:-0.01em; -webkit-font-smoothing:antialiased; }
  main { max-width:1240px; margin:0 auto; padding:28px 20px 48px; }
  button { font:inherit; color:inherit; }

  /* 상단 */
  .top { display:flex; align-items:flex-end; justify-content:space-between; gap:12px 24px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { margin:0; font-size:28px; font-weight:800; letter-spacing:-0.03em; }
  .tagline { margin:2px 0 0; color:var(--muted); font-size:14px; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; }
  .pill { display:inline-flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:12.5px; color:var(--muted); box-shadow:var(--shadow); }
  .pill b { color:var(--ink); font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; background:#2fbf8f; }
  .pill.stale { border-color:var(--warn); color:var(--warn); }
  .pill.stale .dot { background:var(--warn); }
  .banner { margin:0 0 14px; padding:12px 16px; border-radius:12px; font-size:14px; background:var(--warn-bg); color:var(--warn); font-weight:600; }

  /* 달력 카드 */
  .calcard { background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:18px 18px 14px; }
  .bar-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .bar-head h2 { margin:0; font-size:22px; font-weight:800; letter-spacing:-0.03em; flex:1; min-width:140px; }
  .nav { display:inline-flex; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:3px; gap:2px; }
  .nav button { border:0; background:transparent; height:32px; min-width:34px; padding:0 10px; border-radius:9px; cursor:pointer; font-size:14px; }
  .nav button:hover:not(:disabled) { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .nav button:disabled { opacity:.3; cursor:default; }
  .nav .todaybtn { font-weight:600; font-size:13px; }
  .legend { display:flex; gap:14px; font-size:12.5px; color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { width:4px; height:14px; border-radius:2px; display:inline-block; }
  .legend .l-trip { background:var(--c-trip); }
  .legend .l-leave { background:var(--c-leave); }
  .legend .l-event { background:var(--c-event); }

  .dow { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-bottom:1px solid var(--line); }
  .dow div { text-align:center; font-size:12px; font-weight:600; color:var(--muted); padding:8px 0; }
  .dow div:first-child { color:var(--sun); } .dow div:last-child { color:var(--sat); }

  .week { position:relative; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); align-content:start; row-gap:3px; min-height:118px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .week:last-child { border-bottom:0; }
  .cellbg { position:absolute; inset:0; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
  .cell { appearance:none; border:0; background:transparent; border-right:1px solid var(--line); cursor:pointer; padding:0; border-radius:0; }
  .cell:nth-child(7n) { border-right:0; }
  .cell:hover { background:var(--soft); }
  .cell.blank { cursor:default; background:transparent !important; }
  .cell.today { background:var(--brand-soft); }
  .cell.selected { box-shadow:inset 0 0 0 2px var(--brand); }
  .cell:focus-visible { outline:2px solid var(--brand); outline-offset:-2px; }
  .num { position:relative; grid-row:1; pointer-events:none; padding:6px 0 2px 8px; font-size:13px; font-weight:600; height:34px; }
  .num span { display:inline-grid; place-items:center; min-width:26px; height:26px; border-radius:13px; padding:0 4px; }
  .num.sun { color:var(--sun); } .num.sat { color:var(--sat); }
  .num.past { opacity:.45; }
  .num.today span { background:var(--brand); color:#fff; }
  /* 갤럭시 캘린더 스타일: 왼쪽 색 선 + 일반 글씨. 여러 날 이어지는 일정만 옅은 배경으로 연결 */
  .trip { --c:var(--c-trip); --t:var(--t-trip); }
  .leave { --c:var(--c-leave); --t:var(--t-leave); }
  .event { --c:var(--c-event); --t:var(--t-event); }
  .bar, .chip { position:relative; color:var(--ink); }
  .bar::before, .chip::before { content:""; position:absolute; left:0; top:2px; bottom:2px; width:3px; border-radius:2px; background:var(--c); }
  .bar { pointer-events:none; align-self:start; margin:0 4px; padding:2px 6px 2px 10px; border-radius:4px; font-size:12.5px; line-height:1.4; font-weight:500; word-break:keep-all; overflow-wrap:anywhere; background:var(--t); }
  .bar.cl { margin-left:0; border-top-left-radius:0; border-bottom-left-radius:0; }
  .bar.cl::before { display:none; }
  .bar.cr { margin-right:0; border-top-right-radius:0; border-bottom-right-radius:0; }

  /* 월간/주간 전환 */
  .seg { display:inline-flex; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:3px; gap:2px; }
  .seg button { border:0; background:transparent; height:32px; padding:0 14px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); }
  .seg button[aria-pressed="true"] { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1); }
  #weekview { display:none; }
  .calcard.wk .dow, .calcard.wk #weeks, .calcard.wk #agenda { display:none; }
  .calcard.wk #weekview { display:block; }
  .wv-row { display:grid; grid-template-columns:52px minmax(0,1fr); }
  .gut { font-size:11px; color:var(--muted); text-align:right; padding-right:8px; position:relative; }
  .wv-days { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-bottom:1px solid var(--line); }
  .wv-day { appearance:none; border:0; background:transparent; cursor:pointer; padding:6px 0 8px; text-align:center; font-size:12px; font-weight:600; color:var(--muted); border-left:1px solid var(--line); }
  .wv-day:first-child { border-left:0; }
  .wv-day b { display:grid; place-items:center; margin:2px auto 0; min-width:30px; height:30px; border-radius:15px; font-size:16px; color:var(--ink); }
  .wv-day.sun, .wv-day.sun b { color:var(--sun); } .wv-day.sat, .wv-day.sat b { color:var(--sat); }
  .wv-day.today b { background:var(--brand); color:#fff; }
  .wv-day.selected { box-shadow:inset 0 0 0 2px var(--brand); }
  .wv-day:hover { background:var(--soft); }
  .wv-allday { border-bottom:1px solid var(--line); }
  .wv-allday .gut { padding-top:8px; }
  .wv-ad { position:relative; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); align-content:start; row-gap:3px; padding:4px 0; min-height:38px; }
  .wv-grid { max-height:640px; overflow-y:auto; }
  .wv-cols { position:relative; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
  .wv-col { position:relative; border-left:1px solid var(--line); cursor:pointer; }
  .wv-col:first-child { border-left:0; }
  .wv-col.today { background:var(--brand-soft); }
  .wv-col:hover { background:var(--soft); }
  .wv-col.today:hover { background:var(--brand-soft); }
  .hl { position:absolute; left:0; right:0; border-top:1px solid var(--line); pointer-events:none; }
  .hlab { position:absolute; right:8px; transform:translateY(-50%); font-size:11px; color:var(--muted); }
  .tb { position:absolute; padding:2px 4px 2px 8px; overflow:hidden; border-radius:4px; font-size:12px; line-height:1.3; font-weight:500; background:var(--t); border:1px solid var(--card); color:var(--ink); word-break:keep-all; overflow-wrap:anywhere; }
  .tb::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c); }
  .tb small { display:block; color:var(--muted); font-weight:500; font-size:11px; }
  .tt { display:none; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; user-select:none; padding:0 4px; }
  .calcard.wk .tt { display:inline-flex; }
  .tt input { accent-color:var(--brand); width:16px; height:16px; margin:0; cursor:pointer; }
  .tb { z-index:1; background:linear-gradient(var(--t),var(--t)), var(--card); }
  .ttb { position:absolute; left:0; right:0; z-index:0; pointer-events:none; padding:2px 6px; overflow:hidden; font-size:11.5px; line-height:1.3; color:var(--muted); background:repeating-linear-gradient(135deg, rgba(120,130,150,.16) 0 6px, rgba(120,130,150,.06) 6px 12px); border:1px dashed rgba(120,130,150,.5); border-radius:4px; }
  .ttb b { font-weight:600; color:var(--ink); opacity:.75; }
  .nowline { position:absolute; left:0; right:0; border-top:2px solid var(--warn); pointer-events:none; z-index:2; }
  .note { color:var(--muted); font-size:12.5px; margin:12px 4px 0; }
  footer { margin:18px 4px 0; color:var(--muted); font-size:12px; line-height:1.6; }

  /* 모바일 목록 */
  #agenda { display:none; }
  .daycard { appearance:none; text-align:left; width:100%; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; cursor:pointer; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); }
  .daycard:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .daycard.today { border-color:var(--brand); box-shadow:0 0 0 1px var(--brand), var(--shadow); }
  .daycard.past { opacity:.6; }
  .daycard .dh { font-size:14px; font-weight:700; display:flex; gap:8px; align-items:center; }
  .daycard.sun .dh { color:var(--sun); } .daycard.sat .dh { color:var(--sat); }
  .daycard .tdy { font-size:11px; background:var(--brand); color:#fff; border-radius:999px; padding:0 8px; }
  .daycard .chip { display:block; border-radius:6px; padding:6px 10px 6px 14px; font-size:14px; font-weight:500; background:var(--t); }
  .daycard .chip::before { top:5px; bottom:5px; left:5px; }
  .chip small { color:var(--muted); font-weight:500; margin-left:6px; }
  .empty { color:var(--muted); text-align:center; padding:28px 0; }

  /* 드로어 */
  .scrim { position:fixed; inset:0; background:var(--scrim); opacity:0; visibility:hidden; transition:opacity .2s, visibility .2s; z-index:10; backdrop-filter:blur(1px); }
  .scrim.open { opacity:1; visibility:visible; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:500px; max-width:100vw; background:var(--card); box-shadow:-12px 0 40px rgba(0,0,0,.2); transform:translateX(100%); visibility:hidden; transition:transform .24s cubic-bezier(.2,.8,.2,1), visibility .24s; z-index:11; display:flex; flex-direction:column; }
  .drawer.open { transform:translateX(0); visibility:visible; }
  .drawer header { display:flex; align-items:center; gap:14px; padding:20px 20px 16px; border-bottom:1px solid var(--line); }
  .dbig { font-size:38px; font-weight:800; letter-spacing:-0.04em; line-height:1; }
  .dsub { flex:1; color:var(--muted); font-size:14px; line-height:1.3; }
  .dsub b { display:block; color:var(--ink); font-size:16px; }
  .drawer header button { border:0; background:var(--soft); width:36px; height:36px; border-radius:50%; font-size:20px; line-height:1; cursor:pointer; }
  .drawer header button:hover { background:var(--line); }
  .drawer .body { padding:6px 20px 28px; overflow-y:auto; }
  .sec { margin-top:20px; }
  .sec h4 { margin:0 0 8px; font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .sec h4::before { content:""; width:10px; height:10px; border-radius:3px; }
  .sec h4::before { width:4px; height:12px; border-radius:2px; background:var(--c); }
  .item { background:var(--soft); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .item .t { font-weight:700; font-size:15.5px; }
  .item .s { color:var(--muted); font-size:13.5px; margin-top:3px; white-space:pre-wrap; }
  .tag { display:inline-block; font-size:11.5px; padding:1px 8px; border-radius:999px; margin-right:8px; font-weight:700; vertical-align:1px; }
  .tag.trip, .tag.leave { background:var(--t); color:var(--ink); box-shadow:inset 0 0 0 1px var(--c); }

  @media (max-width:900px) {
    main { padding:22px 14px 40px; }
    .week { min-height:104px; }
    .bar { font-size:11.5px; padding:2px 6px; margin:0 3px; }
  }
  @media (max-width:640px) {
    main { padding:18px 12px 32px; }
    h1 { font-size:24px; }
    .calcard { padding:14px 12px; border-radius:18px; }
    .dow, #weeks { display:none; }
    .seg { display:none; }
    #agenda { display:flex; flex-direction:column; gap:10px; }
    .bar-head h2 { font-size:19px; }
    .legend { width:100%; }
  }
  @media (max-width:900px) { .wv-row { grid-template-columns:36px minmax(0,1fr); } .tb { font-size:11px; padding-left:6px; } .wv-day b { min-width:26px; height:26px; font-size:14px; } }
  @media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition:none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>센터 일정판</h1>
      <p class="tagline">출장 · 휴가 · 행사를 한눈에</p>
    </div>
    <div class="pills" id="pills"></div>
  </div>
  <div id="banners"></div>

  <section class="calcard">
    <div class="bar-head">
      <h2 id="title"></h2>
      <div class="legend"><span><i class="l-trip"></i>출장</span><span><i class="l-leave"></i>휴가·기타</span><span><i class="l-event"></i>행사</span></div>
      <div class="seg" role="group" aria-label="보기 방식"><button id="vMonth" aria-pressed="true">월간</button><button id="vWeek" aria-pressed="false">주간</button></div>
      <label class="tt" id="ttWrap"><input type="checkbox" id="ttOn"><span id="ttLabel">시간표</span></label>
      <div class="nav">
        <button id="prev" aria-label="이전">‹</button>
        <button id="todayBtn" class="todaybtn">오늘</button>
        <button id="next" aria-label="다음">›</button>
      </div>
    </div>
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div id="weeks"></div>
    <div id="agenda"></div>
    <div id="weekview"></div>
    <div id="rangeNote" class="note" style="display:none"></div>
  </section>
  <footer>출장·휴가는 UWIN 부재 정보(이름·구분·날짜·시간, 일부 출장은 출장목적), 행사는 주간보고 기준입니다. 날짜를 누르면 세부 내용이 열립니다. 검색엔진에 노출되지 않도록 설정돼 있습니다.</footer>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <header>
    <div class="dbig" id="dBig"></div>
    <div class="dsub"><b id="dTitle"></b><span id="dSub"></span></div>
    <button id="dClose" aria-label="닫기">×</button>
  </header>
  <div class="body" id="dBody"></div>
</aside>

<script>
(function () {
  var STALE_HOURS = 24;
  var DOW = ['일','월','화','수','목','금','토'];
  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtTs(s) { var d = new Date(s); return pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function md(s) { return Number(s.slice(5, 7)) + '/' + Number(s.slice(8)); }
  function get(url) {
    return fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  var today = new Date(); today.setHours(12, 0, 0, 0);
  var todayIso = iso(today);
  var view = { y: today.getFullYear(), m: today.getMonth() };
  var minMonth = view.y * 12 + view.m, maxMonth = minMonth + 3;   // 이번 달부터 3개월 뒤까지
  var rangeTo = null;           // UWIN 출장·휴가 조회 마지막 날짜
  var items = {};               // 날짜 → 그날의 항목 (드로어·목록용)
  var spans = [];               // 막대용: {kind,start,end,label,time,range}
  var selected = null;
  var ORDER = { event: 0, trip: 1, leave: 2 };

  function add(k, it) { (items[k] = items[k] || []).push(it); }
  function eachDay(start, end, fn) {
    var s = new Date(start + 'T12:00:00'), e = new Date(end + 'T12:00:00'), n = 0;
    for (var d = s; d <= e && n < 400; d = new Date(d.getTime() + 86400000), n++) fn(iso(d));
  }
  function sorted(k) { return (items[k] || []).slice().sort(function (a, b) { return ORDER[a.kind] - ORDER[b.kind]; }); }
  function spanLabel(sp) { return sp.label + (sp.time ? ' ' + sp.time : ''); }

  // ── 월간/주간 전환 ──
  var mode = 'month', weekStart = null;   // weekStart: 보고 있는 주의 일요일(YYYY-MM-DD)
  var timetables = [], holidays = [], ttOn = false;
  try { ttOn = localStorage.getItem('ttOn') === '1'; } catch (e) {}
  var PX = 48;                           // 주간 보기에서 1시간 높이(px)
  function weekMode() { return mode === 'week' && window.innerWidth > 640; }
  function dayAdd(k, n) { var d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); }
  function sundayOf(k) { return dayAdd(k, -new Date(k + 'T12:00:00').getDay()); }
  function weekBounds() {
    var lo = sundayOf(Math.floor(minMonth / 12) + '-' + pad(minMonth % 12 + 1) + '-01');
    var hi = sundayOf(iso(new Date(Math.floor(maxMonth / 12), maxMonth % 12 + 1, 0, 12)));
    return { lo: lo, hi: hi };
  }
  function parseTime(t) {
    var m = /(\d{1,2}):(\d{2})(?:\s*~\s*(\d{1,2}):(\d{2}))?/.exec(t || '');
    if (!m) return null;

    else $('ttWrap').style.display = 'none';
    $('ttOn').checked = ttOn;
    var events = (ev.events || []).concat(expandRecurring(ev));
    ((uwin && uwin.events) || []).concat(ev.manualLeaves || []).forEach(function (e) {
      var kind = e.type === '출장' ? 'trip' : 'leave';
      var linked = events.filter(function (x) {
        return e.type === '출장' && (x.who || []).indexOf(e.name) >= 0 && x.date <= e.end && (x.endDate || x.date) >= e.start;
      });
      var sp = { kind: kind, start: e.start, end: e.end, label: '(' + e.type + ') ' + e.name, time: e.from ? e.from + '~' + e.to : '', range: e.start !== e.end ? md(e.start) + '~' + md(e.end) : '' };
      spans.push(sp);
      eachDay(e.start, e.end, function (k) { add(k, { kind: kind, e: e, linked: linked, sp: sp }); });
    });
    events.forEach(function (x) {
      var end = x.endDate || x.date;
      var sp = { kind: 'event', start: x.date, end: end, label: x.title, time: x.time || '', range: end !== x.date ? md(x.date) + '~' + md(end) : '' };
      spans.push(sp);
      eachDay(x.date, end, function (k) { add(k, { kind: 'event', x: x, sp: sp }); });
    });
    rangeTo = uwin ? uwin.rangeTo : null;
    render();
  });
  render();
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 150); });
})();
</script>
